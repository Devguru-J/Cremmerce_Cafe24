    <style>
        :root {
            --crem-bg: #F6F5F1;
            --crem-text: #2E2E2E;
            --crem-champagne: #D6C9A3;
            --crem-olive: #4E5626;
            --crem-footer: #EBE9E1;
        }

        /* 전체 폰트 - Pretendard */
        *,
        *::before,
        *::after {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif !important;
        }

        /* 전체 배경 */
        body {
            background: var(--crem-bg) !important;
            color: var(--crem-text) !important;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif !important;
        }

        #wrap {
            background: var(--crem-bg) !important;
        }

        #container,
        #contents {
            background: var(--crem-bg) !important;
        }

        /* 헤더 - 모든 요소 강제 적용 */
        #header,
        #header.layout1,
        header#header,
        header#header.layout1,
        #header *,
        #header.layout1 *,
        .xans-layout-header,
        .xans-layout-header *,
        .headerWrap,
        .headerWrap *,
        .gnbWrap,
        .gnbWrap * {
            background: var(--crem-bg) !important;
            color: var(--crem-text) !important;
        }

        #header,
        #header.layout1 {
            border-bottom: 1px solid #E5E5E5 !important;
        }

        #header input[type="text"],
        #header input[type="search"],
        .xans-layout-header input[type="text"] {
            background: white !important;
        }

        #header a:hover,
        .xans-layout-header a:hover {
            color: var(--crem-olive) !important;
        }

        /* 푸터 */
        #footer,
        #footer * {
            background: var(--crem-footer) !important;
            color: var(--crem-text) !important;
        }

        /* 상품 카드 / 리스트 아이템 배경 */
        .ec-base-product .prdList li,
        .ec-base-product .prdList .thumbnail,
        .xans-product-listmain li,
        .xans-myshop-recentproduct li {
            background: var(--crem-bg) !important;
        }

        /* 페이지네이션 배경 */
        .ec-base-paginate,
        .xans-common-paging {
            background-color: var(--crem-bg) !important;
        }

        .ec-base-paginate a,
        .xans-common-paging a,
        .ec-base-paginate a.first,
        .ec-base-paginate a.last,
        .ec-base-paginate a.prev,
        .ec-base-paginate a.next {
            background-color: white !important;
            border: 1px solid var(--crem-champagne) !important;
            color: var(--crem-text) !important;
        }

        .ec-base-paginate a.this,
        .xans-common-paging strong {
            background-color: var(--crem-olive) !important;
            border: 1px solid var(--crem-olive) !important;
            color: white !important;
        }

        /* 사이드바 / 마이샵 메뉴 */
        #sidebar,
        #sidebar *,
        .xans-layout-sidebar,
        .xans-layout-sidebar * {
            background: var(--crem-bg) !important;
        }

        /* 콘텐츠 내 흰색 박스들 */
        .xans-myshop-recentproduct .list,
        .xans-myshop-recentproduct .ec-base-product,
        .prdBox,
        div.prdBox {
            background: var(--crem-bg) !important;
        }

        /* 총 주문금액 바 */
        #totalPrice,
        .totalPrice,
        div#totalPrice.totalPrice {
            background-color: var(--crem-bg) !important;
            color: var(--crem-text) !important;
        }

        /* 비디오 박스 ::before 오버레이 배경 */
        .main_video_box::before {
            background: var(--crem-bg) !important;
        }
    </style>
</head>
